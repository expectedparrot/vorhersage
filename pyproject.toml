[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vorhersage"
version = "0.2.0"
description = "A durable forecasting workflow for agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vorhersage = "vorhersage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vorhersage"
version = "0.3.0"
description = "An evidence-backed forecasting workbench for people and agents"
requires-python = ">=3.11"
dependencies = [
    "flyvbjerg @ git+https://github.com/expectedparrot/flyvbjerg.git@main",
]

[project.scripts]
vorhersage = "vorhersage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
